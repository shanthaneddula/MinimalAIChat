disabled_rules:
  - trailing_whitespace
  - line_length
  - function_body_length
  - file_length
  - type_body_length
  - cyclomatic_complexity
  - force_cast
  - force_try
  - force_unwrapping
  - todo

opt_in_rules:
  - empty_count
  - missing_docs
  - force_unwrapping
  - empty_string
  - closure_spacing
  - explicit_init
  - overridden_super_call
  - redundant_nil_coalescing
  - private_outlet
  - prohibited_super_call
  - redundant_type_annotation
  - sorted_imports
  - strict_fileprivate
  - toggle_bool
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

included:
  - Sources
  - Tests

excluded:
  - Resources
  - Documentation
  - Archived

line_length:
  warning: 120
  error: 200

type_name:
  min_length: 3
  max_length: 50

identifier_name:
  min_length: 2
  max_length: 40

function_body_length:
  warning: 50
  error: 100

file_length:
  warning: 500
  error: 1000

cyclomatic_complexity:
  warning: 10
  error: 20

function_parameter_count:
  warning: 6
  error: 8

large_tuple:
  warning: 3
  error: 4

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 50
  error: 100

nesting:
  type_level:
    warning: 3
    error: 4
  statement_level:
    warning: 5
    error: 6 